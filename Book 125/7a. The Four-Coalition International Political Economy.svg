<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" width="500" height="500" style="background-color: #ffffff; border-radius: 8px; padding: 10px;">  

  <!-- Metadata -->
  <!-- The Four-Coalition International Political Economy -->
  <!-- Lord Soumadeep Ghosh with Z.ai -->
  
  <!-- Nations -->
  <polygon points="150,25 85,137.5 215,137.5" fill="#A8DADC" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="20,250 150,250 85,137.5" fill="#FFCCD5" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="150,250 280,250 215,137.5" fill="#B5E48C" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="85,137.5 150,250 215,137.5" fill="#FFD166" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"/>

  <!-- Capital dots -->
  <circle cx="150" cy="25" r="4" fill="#2B2D42"/>
  <circle cx="20" cy="250" r="4" fill="#2B2D42"/>
  <circle cx="280" cy="250" r="4" fill="#2B2D42"/>
  
  <!-- Common city dots -->
  <circle cx="85" cy="137.5" r="4" fill="#2B2D42"/>
  <circle cx="215" cy="137.5" r="4" fill="#2B2D42"/>
  <circle cx="150" cy="250" r="4" fill="#2B2D42"/>

  <!-- Labels -->
  <text x="150" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2B2D42">Divine</text>
  <text x="150" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555555">(Area = ¼A)</text>

  <text x="150" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2B2D42">Capitalist</text>
  <text x="150" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555555">(Area = ¼A)</text>

  <text x="80" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2B2D42">Labor</text>
  <text x="80" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555555">(Area = ¼A)</text>

  <text x="215" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2B2D42">Demoniac</text>
  <text x="215" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555555">(Area = ¼A)</text>

  <!-- Capital Annotations -->
  <text x="160" y="20" text-anchor="start" font-family="Arial, sans-serif" font-size="11" fill="#888">Capital D</text>
  <text x="13" y="270" text-anchor="start" font-family="Arial, sans-serif" font-size="11" fill="#888">Capital L</text>
  <text x="280" y="270" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#888">Capital d</text>
  
  <!-- Midpoint Annotations -->
  <text x="78" y="132" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#888">Common City DL</text>
  <text x="222" y="132" text-anchor="start" font-family="Arial, sans-serif" font-size="10" fill="#888">Common City Dd</text>
  <text x="150" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Common City Ld</text>
  
</svg>
